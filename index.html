<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <style>
        *{
            background-color: rgb(173, 173, 195);
        }
        .name{
            font-size: 30px;
            text-align: center;
            font-weight: bolder;
            font-family: cursive;
        }
        #userInfo{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        .eachProfile{
            width: 23%;
            text-align: center;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 30px 60px -12px inset, rgba(0, 0, 0, 0.3) 0px 18px 36px -18px inset;
            padding: 20px;
            margin-bottom: 30px;
            position: relative;
            font-size: larger;
        }

        .eachProfile img{
            width: 70%;
            height: 180px;
        }
    @media screen and (max-width: 468px){
        .eachProfile {
        width: 100%;
        }
        .name{
            font-size: 16px;
        }
    }

    </style>
</head>
<body>
    <h1 class="name">DummyJason Profile Card</h1>
    <div id="userInfo"></div>
    <script src="profile.js"></script>
</body>
</html>
